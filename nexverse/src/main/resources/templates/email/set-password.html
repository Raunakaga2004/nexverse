<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Nexverse Password</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            height: auto;
            color : #2D2D2D;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
        }
        .content h1{
            text-align: center;
            margin: 0;
            font-weight: 600;
        }
        .logo {
            width:140px;
            height:auto;
            display:block;
            margin: 0 auto 16px;
        }
        .header {
            padding-top: 30px;
            padding-bottom: 10px;
            text-align: center;
        }
        .header h4 {
            color: #d97959;
        }
        .content {
            padding: 20px 30px;
            border: 1px solid #ECECEC;
            background: #f7f3f2;
            max-width: 600px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin : 10px 0px;
        }
        .btn-container {
            text-align: center;
            margin: 50px 0;
        }
        .btn {
            background-color: #d97959;
            color: white;
            padding: 12px 30px;
            border-radius: 5px;
            font-weight: 600;
            border: solid 2px #d97959;
            box-shadow: 0 2px 5px rgba(79, 70, 229, 0.3);
        }
        a{
            text-decoration:none;
        }
        a .link {
            color: black;
        }
        .expiry-text {
            font-size: 13px;
            color: #6B7280;
            background-color: #F9FAFB;
            padding: 10px;
            border-left: 4px solid #EA580C;
            margin: 20px 0;
        }
        .signature {
            margin: 30px 0px;
        }
    </style>
</head>
<body>
<div class="content">
    <div class="header">
        <img src="cid:nexverse-logo" alt="NexVerse" class="logo">
        <h2>NexVerse</h2>
        <h4>Enterprise Learning Platform</h4>
    </div>
    <h1 th:text="${title}"></h1>
    <p>
        Hello,<br>
    <p th:text="${body}"></p>
    </p>
    <div class="btn-container">
        <a th:href="${setPasswordLink}" th:text="${title}" class="btn"></a>
    </div>
    <div class="expiry-text">
        This link is valid for the next 24 hours. If you did not make this request, you can safely ignore this email.
    </div>
    <p>Having trouble with the button? Use the following link: <a th:href="${setPasswordLink}"
                                                                  th:text="${setPasswordLink}" class="link"></a></p>
    <p class="signature">Thanks,<br>The Nexverse Team</p>
</div>
</body>
</html>
