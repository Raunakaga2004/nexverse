<div class="dialog-box">
  <h2 mat-dialog-title>{{ title }}</h2>

  <mat-dialog-content>
    <form [formGroup]="form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Department Name</mat-label>

        <input
          matInput
          formControlName="name"
          maxlength="100"
          placeholder="Enter department name"
          autocomplete="off"
        />

        <mat-hint align="end">
          {{ form.controls.name.value.length }}/100
        </mat-hint>

        @if (form.controls.name.hasError("required")) {
          <mat-error> Department name is required. </mat-error>
        }

        @if (form.controls.name.hasError("maxlength")) {
          <mat-error> Department name cannot exceed 100 characters. </mat-error>
        }
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()" [disabled]="loading">
      Cancel
    </button>
    <button
      mat-flat-button
      color="primary"
      type="button"
      (click)="submit()"
      [disabled]="form.invalid || loading"
    >
      @if (loading) {
        <mat-spinner diameter="20"></mat-spinner>
      } @else {
        {{ actionLabel }}
      }
    </button>
  </mat-dialog-actions>
</div>
