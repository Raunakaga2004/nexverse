@if (loading) {
  <div class="loading-container">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
} @else {
  <div class="dashboard-content-page dashboard">
    <section class="metrics-grid">
      <mat-card class="metric-card">
        <mat-card-content>
          <span class="metric-label"> Organizations </span>
          <h2>{{ dashboardData.metrics.totalOrganizations }}</h2>
        </mat-card-content>
      </mat-card>
      <mat-card class="metric-card">
        <mat-card-content>
          <span class="metric-label"> Users </span>
          <h2>{{ dashboardData.metrics.totalUsers }}</h2>
        </mat-card-content>
      </mat-card>
      <mat-card class="metric-card">
        <mat-card-content>
          <span class="metric-label"> Storage </span>
          <h2>
            {{ dashboardData.metrics.totalStorageBytes | fileSize }}
          </h2>
        </mat-card-content>
      </mat-card>
    </section>
    <mat-card class="chart-card">
      <div class="page-header">
        <h2>Platform Growth</h2>
        <mat-button-toggle-group
          [value]="selectedPeriod"
          (change)="onPeriodChange($event.value)"
        >
          <mat-button-toggle value="LAST_12_MONTHS"
            >12 Months</mat-button-toggle
          >
          <mat-button-toggle value="LAST_3_YEARS">3 Years</mat-button-toggle>
          <mat-button-toggle value="LAST_5_YEARS">5 Years</mat-button-toggle>
        </mat-button-toggle-group>
      </div>
      <mat-divider></mat-divider>
      <mat-card-content>
        <app-growth-chart
          [growth]="dashboardData.growth"
          [period]="selectedPeriod"
          [series]="growthSeries"
        ></app-growth-chart>
      </mat-card-content>
    </mat-card>
  </div>
}
