<div class="dialog-box">
  <h2>
    {{ data.title }}
  </h2>
  <mat-dialog-content>
    <p>{{ data.message }}</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button (click)="cancel()">
      {{ data.cancelText }}
    </button>
    <button
      mat-flat-button
      [color]="data.confirmColor ?? 'primary'"
      (click)="confirm()"
    >
      {{ data.confirmText }}
    </button>
  </mat-dialog-actions>
</div>
